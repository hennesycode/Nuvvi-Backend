services:
  backend:
    build: .
    container_name: nuvvi-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8003:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - nuvvi-network

volumes:
  static_volume:
  media_volume:

networks:
  nuvvi-network:
    driver: bridge
